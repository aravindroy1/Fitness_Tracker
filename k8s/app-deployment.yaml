apiVersion: v1
kind: ConfigMap
metadata:
  name: fitness-config
data:
  MONGODB_URI: "mongodb://fitness-mongo-service:27017/fitness-tracker"
  PORT: "5000"
  HOST: "0.0.0.0"
  NODE_ENV: "production"

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitness-tracker-app
  namespace: fitness-ns
spec:
  replicas: 3

 

  selector:
    matchLabels:
      app: fitness-tracker-app
  template:
    metadata:
      labels:
        app: fitness-tracker-app
    spec:
      containers:
        - name: fitness-tracker-app
          image: pulkit197/fitness_tracker-master-copy3-fitness-app:latest
          ports:
            - containerPort: 5000
          resources:
            limits:
              memory: "512Mi"
              cpu: "200m" 
            requests:
              memory: "256Mi" 
              cpu: "100m"
          # ✔ All configMap vars removed
          # ✔ Direct env variables added
          envFrom:
          - configMapRef:
              name: fitness-config
      
